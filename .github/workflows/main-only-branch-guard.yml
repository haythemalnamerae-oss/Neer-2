name: Main-only branch guard

on:
  create:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-only-branch-guard
  cancel-in-progress: false

jobs:
  enforce-main-only:
    if: github.ref != 'refs/heads/main' || github.event_name == 'create' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reset reserved branches and remove all others
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.event.ref_type }}
          EVENT_REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail

          MAIN_SHA="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"

          reset_reserved_branch() {
            local branch="$1"
            echo "Resetting reserved branch to main: $branch"
            gh api --method PATCH "repos/$REPOSITORY/git/refs/heads/$branch" \
              -f sha="$MAIN_SHA" -F force=true
          }

          delete_forbidden_branch() {
            local branch="$1"
            [ "$branch" = "main" ] && return 0
            echo "Deleting unapproved branch: $branch"
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch"
          }

          enforce_branch() {
            local branch="$1"
            case "$branch" in
              "fix/vercel-routing-performance"|"v0/mobile-responsive-fix")
                reset_reserved_branch "$branch"
                ;;
              "main")
                ;;
              *)
                delete_forbidden_branch "$branch"
                ;;
            esac
          }

          if [ "$EVENT_NAME" = "create" ]; then
            if [ "$REF_TYPE" = "branch" ]; then
              enforce_branch "$EVENT_REF"
            fi
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            enforce_branch "$REF_NAME"
            exit 0
          fi

          # Manual recovery: keep main, reset the two reserved branches, delete all others.
          gh api --paginate "repos/$REPOSITORY/branches?per_page=100" --jq '.[].name' |
            while IFS= read -r branch; do
              [ -n "$branch" ] && enforce_branch "$branch"
            done
